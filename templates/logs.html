
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<div class="card">

<h2>Security Audit Logs</h2>

<table>

<tr>
<th>ID</th>
<th>Username</th>
<th>Action</th>
<th>Timestamp</th>
</tr>

{% for log in logs %}

<tr>
<td>{{ log[0] }}</td>
<td>{{ log[1] }}</td>
<td>{{ log[2] }}</td>
<td>{{ log[3] }}</td>
</tr>

{% endfor %}

</table>

</div>
