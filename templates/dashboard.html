
{% extends 'base.html' %}

{% block title %}Dashboard | EduProof{% endblock %}

{% block content %}

<h1 class="mb-4">
    <i class="fa-solid fa-gauge"></i>
    Dashboard
</h1>

<div class="row">

    <div class="col-md-4 mb-4">

        <div class="glass-card text-center">

            <i class="fa-solid fa-certificate fa-3x mb-3 text-info"></i>

            <h3>Certificates</h3>

            <p>
                Manage and verify certificates securely.
            </p>

        </div>

    </div>

    <div class="col-md-4 mb-4">

        <div class="glass-card text-center">

            <i class="fa-solid fa-users fa-3x mb-3 text-info"></i>

            <h3>Users</h3>

            <p>
                Manage registered users in the system.
            </p>

        </div>

    </div>

    <div class="col-md-4 mb-4">

        <div class="glass-card text-center">

            <i class="fa-solid fa-shield-halved fa-3x mb-3 text-info"></i>

            <h3>Security</h3>

            <p>
                Secure educational verification platform.
            </p>

        </div>

    </div>

</div>

{% endblock %}
