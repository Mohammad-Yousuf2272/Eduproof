<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduProof{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height:100vh;
            color:white;
        }

        .navbar{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            padding: 15px 30px;
        }

        .navbar-brand{
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8 !important;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            transition:0.3s;
        }

        .nav-link:hover{
            color:#38bdf8 !important;
        }

        .main-content{
            padding:40px 20px;
        }

        .glass-card{
            background: rgba(255,255,255,0.08);
            border-radius:20px;
            backdrop-filter: blur(14px);
            padding:30px;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        .btn-custom{
            background:#38bdf8;
            border:none;
            color:white;
            border-radius:12px;
            padding:10px 20px;
            transition:0.3s;
        }

        .btn-custom:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        footer{
            text-align:center;
            padding:20px;
            margin-top:40px;
            color:#cbd5e1;
        }

    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-graduation-cap"></i>
                EduProof
            </a>

            <div class="ms-auto">

                <a class="nav-link d-inline" href="/">
                    Home
                </a>

                <a class="nav-link d-inline" href="/login">
                    Login
                </a>

                <a class="nav-link d-inline" href="/register">
                    Register
                </a>

                <a class="nav-link d-inline" href="/verify">
                    Verify
                </a>

            </div>

        </div>

    </nav>

    <div class="main-content container">

        {% block content %}

        {% endblock %}

    </div>

    <footer>
        © 2026 EduProof | Secure Educational Verification System
    </footer>

</body>
</html>
