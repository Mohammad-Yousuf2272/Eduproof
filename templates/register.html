
{% extends 'base.html' %}

{% block title %}Register | EduProof{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="glass-card" style="width: 450px;">

        <h2 class="text-center mb-4">
            <i class="fa-solid fa-user-plus"></i>
            Register
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter your full name"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Create password"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-custom w-100">
                Register
            </button>

        </form>

        <div class="text-center mt-3">

            Already have an account?

            <a href="/login" class="text-info">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
